server:
  port: 8083

spring:
  application:
    name: tpbank-service
  datasource:
    url: ${TPBANK_DB_URL:jdbc:postgresql://localhost:5432/tpbank_db}
    username: ${TPBANK_DB_USER:postgres}
    password: ${TPBANK_DB_PASSWORD:11111111}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

cic:
  base-url: ${CIC_BASE_URL:http://localhost:8084}

tpbank:
  outbox:
    enabled: ${TPBANK_OUTBOX_ENABLED:true}
    fixed-delay-ms: ${TPBANK_OUTBOX_FIXED_DELAY_MS:10000}
